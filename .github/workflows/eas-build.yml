name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for'
        required: true
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile to use'
        required: true
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  # Quality checks run first - fast feedback
  quality-checks-frontend:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint TypeScript/JavaScript
        run: npm run lint
        continue-on-error: false
      
      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: false
      
      - name: Run Frontend Tests
        run: npm test --if-present
        continue-on-error: false
      
      - name: Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  quality-checks-backend:
    name: Backend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black mypy bandit pytest-cov
      
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: false
      
      - name: Check code formatting with black
        run: black --check app tests
        continue-on-error: true
      
      - name: Type check with mypy
        run: mypy app --ignore-missing-imports
        continue-on-error: true
      
      - name: Security check with bandit
        run: bandit -r app -ll
        continue-on-error: true
      
      - name: Run Python tests with coverage
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=term
        continue-on-error: false
      
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30

  detect-build-requirements:
    name: Detect Build Requirements
    runs-on: ubuntu-latest
    needs: [quality-checks-frontend, quality-checks-backend]
    outputs:
      platform: ${{ steps.set-platform.outputs.platform }}
      profile: ${{ steps.set-profile.outputs.profile }}
      should-build: ${{ steps.set-profile.outputs.should-build }}
      build-ios: ${{ steps.set-platform.outputs.build-ios }}
      build-android: ${{ steps.set-platform.outputs.build-android }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set build platform and profile
        id: set-platform
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORM="${{ github.event.inputs.platform }}"
          else
            PLATFORM="all"
          fi
          
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "ios" ]; then
            echo "build-ios=true" >> $GITHUB_OUTPUT
          else
            echo "build-ios=false" >> $GITHUB_OUTPUT
          fi
          
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "android" ]; then
            echo "build-android=true" >> $GITHUB_OUTPUT
          else
            echo "build-android=false" >> $GITHUB_OUTPUT
          fi
          
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
      
      - name: Set build profile
        id: set-profile
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROFILE="${{ github.event.inputs.profile }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            PROFILE="production"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            PROFILE="preview"
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            PROFILE="development"
          else
            PROFILE="preview"
          fi
          echo "profile=$PROFILE" >> $GITHUB_OUTPUT
          echo "should-build=true" >> $GITHUB_OUTPUT

  build-ios:
    name: Build iOS
    runs-on: ubuntu-latest
    needs: detect-build-requirements
    if: needs.detect-build-requirements.outputs.should-build == 'true' && needs.detect-build-requirements.outputs.build-ios == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build on EAS
        uses: expo/eas-build@v2
        with:
          eas-version: latest
          platform: ios
          profile: ${{ needs.detect-build-requirements.outputs.profile }}
          token: ${{ secrets.EXPO_TOKEN }}
          wait: true
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-${{ needs.detect-build-requirements.outputs.profile }}
          path: |
            *.ipa
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: detect-build-requirements
    if: needs.detect-build-requirements.outputs.should-build == 'true' && needs.detect-build-requirements.outputs.build-android == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build on EAS
        uses: expo/eas-build@v2
        with:
          eas-version: latest
          platform: android
          profile: ${{ needs.detect-build-requirements.outputs.profile }}
          token: ${{ secrets.EXPO_TOKEN }}
          wait: true
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-android-${{ needs.detect-build-requirements.outputs.profile }}
          path: |
            *.apk
            *.aab
          retention-days: 30

  deployment-status:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [build-ios, build-android]
    if: always()
    steps:
      - name: Check deployment readiness
        run: |
          echo "Build Profile: ${{ needs.detect-build-requirements.outputs.profile }}"
          echo "Branch: ${{ github.ref }}"
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "✅ Builds complete for main branch"
            echo "📦 Preview builds are ready for testing"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "🚀 Production builds complete"
            echo "📝 Ready for manual store submission"
            echo ""
            echo "To submit to stores manually:"
            echo "  iOS: eas submit --platform ios --profile production"
            echo "  Android: eas submit --platform android --profile production"
          else
            echo "✅ Development builds complete"
          fi
