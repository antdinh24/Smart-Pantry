[pytest]
# Pytest configuration file
#
# Product Manager Note:
# - This configures how tests run
# - Sets up test discovery (finds test files automatically)
# - Configures coverage reports
# - Sets test markers for organizing tests

# Minimum Python version
minversion = 7.0

# Where to find tests
testpaths = tests

# Python files to search for tests
python_files = test_*.py

# Python classes to search for tests
python_classes = Test*

# Python functions to search for tests
python_functions = test_*

# Command line options to always use
addopts =
    # Verbose output
    -v
    # Show summary of all test types
    --strict-markers
    # Coverage options
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    # Show local variables in tracebacks
    -l
    # Show warnings
    -W error::UserWarning

# Async support
asyncio_mode = auto

# Custom markers for organizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, external APIs)
    slow: Tests that take a long time
    auth: Authentication-related tests
    recipes: Recipe-related tests
    pantry: Pantry-related tests
    receipts: Receipt-related tests
    budget: Budget-related tests
